services:
  # Node.js + Express Backend Web Service
  - type: web
    name: greenloop-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: greenloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MATCHER_SERVICE_URL
        value: http://greenloop-matcher:8000
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Python Machine Learning & Classifier Microservice
  - type: web
    name: greenloop-matcher
    env: python
    rootDir: matcher
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 8000
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # React + Vite Frontend Static Web Application
  - type: web
    name: greenloop-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: greenloop-backend
          property: host

databases:
  # Managed PostgreSQL Relational Database
  - name: greenloop-db
    databaseName: greenloop
    user: greenloop_user
    plan: free
